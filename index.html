<style id="css">/* Layout: a creator's spec sheet on paper. A huge expanded wordmark, the work right under it,
   then sections that read like a product sheet: a mono label on the left, content on the right. */
:root {
  --ink: #f3f3f0;        /* page: off-white with a faint grey bias, like a white desk */
  --panel: #ffffff;      /* tiles and cards */
  --line: #d9d9d3;       /* hairlines and the frame around the grids */
  --paper: #121315;      /* text */
  --muted: #64656b;      /* secondary text */
  --cream: #8c5e26;      /* accent: a darker take on the cream line of the video covers, readable on white */
  --on-accent: #ffffff;  /* text on accent buttons */
  --display: "Archivo", "Arial Black", "Helvetica Neue", Arial, sans-serif;
  --body: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --gutter: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  --wrap: 1240px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body {
  background: var(--ink); color: var(--paper);
  font: 400 17px/1.6 var(--body); font-stretch: 100%;
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ink); }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--cream); outline-offset: 3px; }
.wrap { max-width: var(--wrap); margin: 0 auto; padding-left: var(--gutter); padding-right: var(--gutter-r); }

/* nav */
.nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--ink) 86%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.nav .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 14px; }
.nav .handle { font: 600 13px/1 var(--mono); letter-spacing: .02em; text-decoration: none; }
.nav ul { display: flex; gap: clamp(14px, 3vw, 32px); list-style: none; margin: 0; padding: 0; }
.nav ul a { font: 700 12px/1 var(--display); font-stretch: 125%; letter-spacing: .12em; text-transform: uppercase; text-decoration: none; color: var(--muted); }
.nav ul a:hover { color: var(--paper); }
.nav .cta-mini { color: var(--on-accent); background: var(--cream); padding: 9px 14px; border-radius: 0; font: 700 12px/1 var(--display); font-stretch: 125%; letter-spacing: .1em; text-transform: uppercase; text-decoration: none; white-space: nowrap; }
@media (max-width: 640px) { .nav ul { display: none; } }

/* hero */
.hero { padding-block: clamp(40px, 7vw, 88px) clamp(28px, 4vw, 48px); }
.kicker { display: flex; flex-wrap: wrap; gap: 8px 22px; font: 400 12px/1.4 var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.kicker b { color: var(--cream); font-weight: 600; }
.wordmark {
  margin: 18px 0 0; font-family: var(--display); font-weight: 900; font-stretch: 125%;
  font-size: clamp(26px, 9.2vw, 118px); line-height: 1; letter-spacing: -.035em; text-transform: uppercase;
  white-space: nowrap;
}
.wordmark .u { color: var(--cream); }
.hero-row { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: clamp(20px, 4vw, 64px); align-items: end; margin-top: clamp(24px, 4vw, 44px); }
.lede { margin: 0; max-width: 34ch; font: 500 clamp(19px, 2.1vw, 26px)/1.35 var(--body); text-wrap: balance; }
.lede em { font-style: italic; color: var(--cream); }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid var(--line); }
.facts div { padding: 14px 12px 0 0; }
.facts dt { font: 400 11px/1.3 var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.facts dd { margin: 6px 0 0; font: 800 clamp(24px, 3vw, 34px)/1 var(--display); font-stretch: 112%; font-variant-numeric: tabular-nums; }
@media (max-width: 760px) { .hero-row { grid-template-columns: 1fr; } }

/* sections: mono label + content */
section { border-top: 1px solid var(--line); }
.sec { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 24px clamp(20px, 4vw, 56px); padding-block: clamp(48px, 7vw, 96px); }
.label { font: 600 12px/1.4 var(--mono); text-transform: uppercase; letter-spacing: .1em; color: var(--cream); }
.label span { display: block; color: var(--muted); font-weight: 400; margin-top: 6px; text-transform: none; letter-spacing: 0; font-size: 13px; line-height: 1.5; font-family: var(--body); }
h2 { margin: 0 0 18px; font: 800 clamp(30px, 4.4vw, 56px)/.98 var(--display); font-stretch: 118%; letter-spacing: -.02em; text-transform: uppercase; text-wrap: balance; }
.intro { margin: 0 0 32px; max-width: 62ch; color: var(--muted); }
.intro strong { color: var(--paper); font-weight: 600; }
@media (max-width: 860px) { .sec { grid-template-columns: 1fr; } }

/* short-form videos */
.clips { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding: 4px; margin: 0; }
.clip { margin: 0; min-width: 0; background: var(--panel); box-shadow: 0 0 0 4px var(--line); }
.phone { position: relative; aspect-ratio: 9 / 16; max-width: 100%; border-radius: 0; overflow: hidden; background: var(--panel);  }
.phone video { width: 100%; height: 100%; object-fit: cover; display: block; cursor: pointer; }
.sound { position: absolute; left: 10px; bottom: 10px; border: 0; cursor: pointer; padding: 7px 11px; border-radius: 0; background: color-mix(in srgb, var(--ink) 72%, transparent); color: var(--paper); font: 600 11px/1 var(--mono); letter-spacing: .04em; backdrop-filter: blur(6px); }
.sound .sound-on, .sound[aria-pressed="true"] .sound-off { display: none; }
.sound[aria-pressed="true"] .sound-on { display: inline; }
.sound[aria-pressed="true"] { background: var(--cream); color: var(--on-accent); }
.clip figcaption { padding: 10px 12px 12px; display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: baseline; }
.clip .brand { font: 600 11px/1.3 var(--mono); color: var(--cream); letter-spacing: .06em; }
.clip .prod { font: 700 16px/1.25 var(--display); font-stretch: 110%; }
.clip .meta { flex-basis: 100%; font: 400 12px/1.4 var(--mono); color: var(--muted); }

/* covers: a slice of the profile grid */
.grid-strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding: 4px; }
@media (max-width: 900px) { .clips, .grid-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.grid-strip img { display: block; width: 100%; height: auto; aspect-ratio: 3 / 4; object-fit: cover; box-shadow: 0 0 0 4px var(--line); }
.note { margin: 14px 0 0; font: 400 12px/1.5 var(--mono); color: var(--muted); }

/* photography */
.shots { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding: 4px; }
@media (max-width: 900px) { .shots { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 560px) { .shots { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.shot { margin: 0; min-width: 0; box-shadow: 0 0 0 4px var(--line); position: relative; border-radius: 0; overflow: hidden; background: var(--panel); }
.shot img { display: block; width: 100%; height: auto; aspect-ratio: 3 / 4; object-fit: cover; transition: transform .6s ease; }
.shot:hover img { transform: scale(1.03); }
.shot figcaption { position: absolute; left: 10px; bottom: 10px; right: 10px; display: inline-flex; flex-wrap: wrap; gap: 0 6px; width: fit-content; max-width: calc(100% - 20px); padding: 6px 10px; border-radius: 0; background: color-mix(in srgb, var(--ink) 74%, transparent); backdrop-filter: blur(6px); font: 500 12px/1.3 var(--body); }
.shot figcaption span { font: 600 11px/1.4 var(--mono); color: var(--cream); }
.shot .buy { position: absolute; top: 10px; right: 10px; padding: 7px 11px; background: var(--cream); color: var(--on-accent); font: 700 11px/1 var(--display); font-stretch: 125%; letter-spacing: .08em; text-transform: uppercase; text-decoration: none; }
.shot .buy:hover { background: var(--paper); }
@media (prefers-reduced-motion: reduce) { .shot img { transition: none; } .shot:hover img { transform: none; } }

/* brands */
.brands { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
.brands li { display: flex; align-items: center; justify-content: center; min-height: 96px; padding: 16px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); font: 800 clamp(15px, 1.5vw, 19px)/1.1 var(--display); font-stretch: 125%; letter-spacing: .02em; text-transform: uppercase; text-align: center; color: var(--muted); transition: color .2s, background .2s; }
.brands li:hover { color: var(--paper); background: var(--panel); }
.brands li.logo img { display: block; width: auto; height: auto; max-width: min(70%, 140px); max-height: 34px; object-fit: contain; filter: brightness(0); opacity: .55; transition: opacity .2s; }
.brands li.logo:hover img { opacity: 1; }

/* services */
.services { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: minmax(0, 1fr); max-width: 760px; border-top: 1px solid var(--line); }
.services li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: baseline; padding: 18px 0; border-bottom: 1px solid var(--line); }
.services b { font: 700 clamp(18px, 1.8vw, 22px)/1.2 var(--display); font-stretch: 112%; }
.services small { font: 400 12px/1.4 var(--mono); color: var(--muted); text-align: right; }
@media (max-width: 700px) { .services { grid-template-columns: 1fr; } }

/* contact */
.contact { padding-block: clamp(56px, 9vw, 120px); }
.contact h2 { font-size: clamp(38px, 8vw, 104px); line-height: .9; margin-bottom: 28px; }
.mail { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; margin-bottom: 40px; }
.mail code { font: 600 clamp(16px, 2.4vw, 26px)/1.3 var(--mono); overflow-wrap: anywhere; user-select: all; }
.copy { border: 1px solid var(--cream); background: transparent; color: var(--cream); padding: 10px 16px; border-radius: 0; font: 700 12px/1 var(--display); font-stretch: 125%; letter-spacing: .1em; text-transform: uppercase; cursor: pointer; }
.copy:hover, .copy.done { background: var(--cream); color: var(--on-accent); }
.profiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.profiles a { display: flex; flex-direction: column; gap: 6px; padding: 18px 20px; border: 1px solid var(--line); border-radius: 0; text-decoration: none; background: var(--panel); transition: border-color .2s, transform .2s; min-width: 0; }
.profiles a:hover { border-color: var(--cream); transform: translateY(-2px); }
.profiles .net { font: 600 11px/1.3 var(--mono); color: var(--cream); text-transform: uppercase; letter-spacing: .1em; }
.profiles .id { font: 700 clamp(17px, 1.9vw, 22px)/1.2 var(--display); font-stretch: 110%; overflow-wrap: anywhere; }
.profiles .what { font-size: 14px; color: var(--muted); }
@media (max-width: 760px) { .profiles { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) { .profiles a { transition: none; } .profiles a:hover { transform: none; } }
footer { border-top: 1px solid var(--line); }
footer .wrap { padding-block: 22px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 20px; font: 400 12px/1.5 var(--mono); color: var(--muted); }

/* ── edit mode: only the owner sees it ── */
.brands li.logo img { display: block; width: auto; height: auto; max-width: min(70%, 140px); max-height: 34px; object-fit: contain; filter: brightness(0); opacity: .55; transition: opacity .2s; }
.brands li.logo:hover img { opacity: 1; }
.edit-fab { position: fixed; z-index: 20; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); border: 0; cursor: pointer; padding: 12px 18px; border-radius: 0; background: var(--cream); color: var(--on-accent); font: 700 12px/1 var(--display); font-stretch: 125%; letter-spacing: .1em; text-transform: uppercase; box-shadow: 0 10px 30px -10px #000; }
.editbar { position: fixed; z-index: 20; left: 0; right: 0; bottom: 0; background: var(--panel); border-top: 1px solid var(--cream); padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px)); padding-left: var(--gutter); padding-right: var(--gutter-r); }
.editbar .in { max-width: var(--wrap); margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.editbar p { margin: 0; flex: 1 1 260px; font: 400 13px/1.4 var(--body); color: var(--muted); min-width: 0; }
.editbar p b { color: var(--paper); }
.btn { border: 1px solid var(--line); background: transparent; color: var(--paper); padding: 10px 16px; border-radius: 0; cursor: pointer; font: 700 12px/1 var(--display); font-stretch: 125%; letter-spacing: .08em; text-transform: uppercase; }
.btn.primary { background: var(--cream); color: var(--on-accent); border-color: var(--cream); }
.btn:disabled { opacity: .5; cursor: wait; }
body.editing { padding-bottom: 90px; }
.tools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; }
.tools button { border: 1px solid var(--line); background: var(--ink); color: var(--paper); width: 30px; height: 30px; border-radius: 0; cursor: pointer; font: 600 14px/1 var(--mono); }
.tools button.del { color: #b3261e; }
.tools input { flex: 1 1 110px; min-width: 0; background: var(--ink); color: var(--paper); border: 1px solid var(--line); border-radius: 0; padding: 6px 8px; font: 400 13px/1.2 var(--body); }
.shot .tools, .brands .tools { position: absolute; left: 6px; right: 6px; top: 6px; margin: 0; }
.brands li { position: relative; }
.brands.editing-list li { min-height: 140px; padding-top: 50px; }
.add-card { display: flex; align-items: center; justify-content: center; min-height: 120px; border: 1.5px dashed var(--cream); border-radius: 0; background: transparent; color: var(--cream); cursor: pointer; font: 700 12px/1.3 var(--display); font-stretch: 125%; letter-spacing: .08em; text-transform: uppercase; padding: 16px; width: 100%; }
.clips .add-card { aspect-ratio: 9 / 16; min-height: 0; border-radius: 0; }
.shots .add-card { min-height: 0; aspect-ratio: 3 / 4; }
.modal { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; background: color-mix(in srgb, var(--ink) 80%, transparent); padding: 16px; }
.modal form { width: min(460px, 100%); max-height: 90vh; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 0; padding: 22px; display: grid; gap: 14px; }
.modal h3 { margin: 0; font: 800 20px/1.1 var(--display); font-stretch: 118%; text-transform: uppercase; }
.modal label { display: grid; gap: 6px; font: 600 11px/1.3 var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.modal input { background: var(--ink); color: var(--paper); border: 1px solid var(--line); border-radius: 0; padding: 10px 12px; font: 400 15px/1.3 var(--body); text-transform: none; letter-spacing: 0; min-width: 0; }
.modal .hint { margin: 0; font: 400 13px/1.45 var(--body); color: var(--muted); }
.modal .err { margin: 0; font: 500 13px/1.45 var(--body); color: #b3261e; }
.modal .row { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
</style>

<script id="app">(() => {
  // Il contenuto (video, foto, brand) sta nel JSON #state; la pagina si disegna da lì.
  // In modalità modifica (solo per chi può modificare la pagina) si cambia una bozza e
  // «Pubblica» rigenera tutta la pagina con il nuovo JSON.
  const $ = (s, r = document) => r.querySelector(s);
  const el = (tag, attrs = {}, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v === false || v == null) continue;
      if (k === "class") n.className = v;
      else if (k === "text") n.textContent = v;
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? "" : v);
    }
    for (const c of kids.flat()) if (c != null) n.append(c);
    return n;
  };

  const shell = $("#shell");
  document.body.append(shell.content.cloneNode(true));
  const saved = JSON.parse($("#state").textContent);
  let state = saved, editing = false;
  let assets = null, artifact = null;
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const MAX_MB = 20;

  // ── video: autoplay muto quando sono visibili, audio al tocco ──
  const io = (!still && "IntersectionObserver" in window) ? new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) e.target.play().catch(() => {}); else e.target.pause();
  }), { threshold: 0.35 }) : null;
  function setSound(clip, on) {
    const v = $("video", clip), b = $(".sound", clip);
    if (!v || !b) return;
    v.muted = !on;
    b.setAttribute("aria-pressed", String(on));
    if (on) v.play().catch(() => {});
  }

  // ── strumenti di modifica per un elemento di una lista ──
  function tools(list, i, fields) {
    const t = el("div", { class: "tools" });
    const move = d => { const j = i + d; if (j < 0 || j >= list.length) return; [list[i], list[j]] = [list[j], list[i]]; render(); };
    t.append(
      el("button", { type: "button", title: "Sposta prima", "aria-label": "Sposta prima", onclick: () => move(-1) }, "←"),
      el("button", { type: "button", title: "Sposta dopo", "aria-label": "Sposta dopo", onclick: () => move(1) }, "→"),
      el("button", { type: "button", class: "del", title: "Togli", "aria-label": "Togli dalla pagina", onclick: () => { list.splice(i, 1); render(); } }, "✕"));
    for (const [key, ph] of fields) {
      t.append(el("input", { value: list[i][key] || "", placeholder: ph, "aria-label": ph,
        oninput: e => { list[i][key] = e.target.value; } }));
    }
    return t;
  }

  // ── disegno ──
  function renderClips() {
    const box = $("#clips"); box.replaceChildren();
    state.videos.forEach((v, i) => {
      const video = el("video", { src: v.src, poster: v.poster || false, muted: true, loop: true, playsinline: true,
        preload: "metadata", "aria-label": `${v.brand} ${v.name} unboxing video` });
      video.muted = true;
      const meta = el("span", { class: "meta", text: v.kind || "" });
      video.addEventListener("loadedmetadata", () => {
        if (isFinite(video.duration)) meta.textContent = [v.kind, video.duration.toFixed(1) + "s"].filter(Boolean).join(" · ");
      });
      const clip = el("figure", { class: "clip" },
        el("div", { class: "phone" }, video,
          el("button", { class: "sound", type: "button", "aria-pressed": "false", "aria-label": `Sound for ${v.name}` },
            el("span", { class: "sound-off", text: "Sound off" }), el("span", { class: "sound-on", text: "Sound on" }))),
        el("figcaption", {}, el("span", { class: "brand", text: v.brand }), " ", el("span", { class: "prod", text: v.name }), meta),
        editing ? tools(state.videos, i, [["brand", "Marca"], ["name", "Prodotto"], ["kind", "Tipo (es. Gaming mouse)"]]) : null);
      const toggle = () => {
        const on = video.muted;
        document.querySelectorAll(".clip").forEach(c => { if (c !== clip) setSound(c, false); });
        setSound(clip, on);
      };
      $(".sound", clip).addEventListener("click", toggle);
      video.addEventListener("click", toggle);
      box.append(clip);
      if (io) io.observe(video);
    });
    if (editing) box.append(el("button", { type: "button", class: "add-card", onclick: () => apri("video") }, "+ Aggiungi video"));
  }
  function renderCovers() {
    const box = $("#covers"); box.replaceChildren();
    const con = state.videos.filter(v => v.poster);
    $("#covers-sec").hidden = !con.length;
    con.forEach(v => box.append(el("img", { src: v.poster, alt: `Cover for the ${v.brand} ${v.name} video`, loading: "lazy", width: "720", height: "1280" })));
  }
  function renderShots() {
    const box = $("#shots"); box.replaceChildren();
    if (editing) box.append(el("button", { type: "button", class: "add-card", onclick: () => apri("photo") }, "+ Aggiungi foto"));
    state.photos.forEach((f, i) => {
      const link = /^https:\/\//.test(f.link || "") ? f.link : "";
      box.append(el("figure", { class: "shot" },
        el("img", { src: f.src, alt: `${f.brand} ${f.product}, photographed on my desk`, loading: "lazy" }),
        el("figcaption", {}, el("span", { text: f.brand }), " " + (f.product || "")),
        link ? el("a", { class: "buy", href: link, target: "_blank", rel: "noopener sponsored",
          "aria-label": `Buy the ${f.brand} ${f.product} (affiliate link)` }, "Buy ↗") : null,
        editing ? tools(state.photos, i, [["brand", "Marca"], ["product", "Prodotto"], ["link", "Link affiliato (facoltativo)"]]) : null));
    });
    $("#aff-note").hidden = !state.photos.some(f => /^https:\/\//.test(f.link || ""));
  }
  function renderBrands() {
    const box = $("#brand-list"); box.replaceChildren();
    box.classList.toggle("editing-list", editing);
    state.brands.forEach((b, i) => box.append(el("li", { class: b.logo ? "logo" : false },
      b.logo ? el("img", { src: b.logo, alt: b.name, loading: "lazy" }) : b.name,
      editing ? tools(state.brands, i, [["name", "Nome"]]) : null)));
    if (editing) box.append(el("li", {}, el("button", { type: "button", class: "add-card", onclick: () => apri("brand") }, "+ Aggiungi brand")));
    $("#nbrand").textContent = state.brands.length;
  }
  function render() { renderClips(); renderCovers(); renderShots(); renderBrands(); }
  render();

  // ── email ──
  const btn = $("#copy-email"), mail = $("#email");
  btn.addEventListener("click", () => {
    const done = () => { btn.textContent = "Copied"; btn.classList.add("done"); setTimeout(() => { btn.textContent = "Copy email"; btn.classList.remove("done"); }, 1800); };
    const select = () => { const r = document.createRange(); r.selectNodeContents(mail); const s = getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent = "Selected, press Ctrl+C"; };
    try { navigator.clipboard.writeText(mail.textContent.trim()).then(done, select); } catch (e) { select(); }
  });

  // ── finestra «aggiungi» ──
  const FORM = {
    video: { title: "Aggiungi un video", files: [["file", "Video (mp4, verticale)", "video/mp4,video/webm,video/quicktime", true], ["cover", "Copertina (facoltativa)", "image/*", false]],
      fields: [["brand", "Marca", true], ["name", "Prodotto", true], ["kind", "Tipo (es. Gaming mouse)", false]],
      hint: `Massimo ${MAX_MB} MB. Nell'app, sotto il video, «Scarica per la landing» ti dà una versione leggera (circa 5 MB).` },
    photo: { title: "Aggiungi una foto", files: [["file", "Foto", "image/*", true]], fields: [["brand", "Marca", true], ["product", "Prodotto", false], ["link", "Link affiliato (facoltativo, https://…)", false]],
      hint: `Massimo ${MAX_MB} MB. Va bene anche la foto del telefono. Con il link compare «Buy ↗» sulla foto e la nota sui link affiliati.` },
    brand: { title: "Aggiungi un brand", files: [["logo", "Logo (facoltativo: PNG trasparente o SVG)", "image/png,image/svg+xml,image/webp", false]],
      fields: [["name", "Nome del brand", true]], hint: "Senza logo il nome appare scritto. Il logo diventa nero da solo, come gli altri." },
  };
  function apri(tipo) {
    const cfg = FORM[tipo];
    const err = el("p", { class: "err", role: "alert" });
    const ok = el("button", { type: "submit", class: "btn primary" }, "Aggiungi");
    const form = el("form", {},
      el("h3", { text: cfg.title }),
      ...cfg.files.map(([k, lab, acc, req]) => el("label", {}, lab, el("input", { type: "file", name: k, accept: acc, required: req }))),
      ...cfg.fields.map(([k, lab, req]) => el("label", {}, lab, el("input", { name: k, required: req }))),
      el("p", { class: "hint", text: cfg.hint }), err,
      el("div", { class: "row" }, el("button", { type: "button", class: "btn", onclick: () => modal.remove() }, "Annulla"), ok));
    const modal = el("div", { class: "modal", role: "dialog", "aria-modal": "true", "aria-label": cfg.title }, form);
    form.addEventListener("submit", async e => {
      e.preventDefault();
      err.textContent = "";
      const up = {};
      for (const [k] of cfg.files) {
        const f = form.elements[k].files[0];
        if (!f) continue;
        if (f.size > MAX_MB * 1024 * 1024) { err.textContent = `«${f.name}» pesa ${(f.size / 1048576).toFixed(0)} MB: il limite è ${MAX_MB} MB.`; return; }
        up[k] = f;
      }
      ok.disabled = true;
      try {
        const url = {};
        for (const [k, f] of Object.entries(up)) {
          ok.textContent = `Carico ${f.name}…`;
          url[k] = (await assets.upload(f)).url;
        }
        const v = Object.fromEntries(cfg.fields.map(([k]) => [k, form.elements[k].value.trim()]));
        if (tipo === "video") state.videos.push({ src: url.file, poster: url.cover || "", brand: v.brand, name: v.name, kind: v.kind });
        if (tipo === "photo") state.photos.unshift({ src: url.file, brand: v.brand, product: v.product, link: v.link || "" });
        if (tipo === "brand") state.brands.push({ name: v.name, logo: url.logo || "" });
        modal.remove();
        render();
      } catch (x) {
        const code = x && x.code;
        err.textContent = code === "too_large" ? `File troppo grande (massimo ${MAX_MB} MB).`
          : code === "unsupported_type" ? "Tipo di file non accettato."
          : code === "quota_or_state" ? "Spazio della pagina pieno: togli qualche video vecchio."
          : `Caricamento non riuscito (${code || "errore"}). Riprova.`;
        ok.disabled = false; ok.textContent = "Aggiungi";
      }
    });
    document.body.append(modal);
    form.querySelector("input").focus();
  }

  // ── modalità modifica ──
  let bar = null;
  function entra() {
    editing = true;
    state = JSON.parse(JSON.stringify(saved));
    document.body.classList.add("editing");
    fab.hidden = true;
    const pub = el("button", { type: "button", class: "btn primary" }, "Pubblica le modifiche");
    const msg = el("p", {}, el("b", { text: "Modalità modifica. " }), "Sposta con ← →, togli con ✕, aggiungi con i riquadri tratteggiati. Chi apre il link vede le modifiche solo dopo «Pubblica».");
    bar = el("div", { class: "editbar" }, el("div", { class: "in" }, msg,
      el("button", { type: "button", class: "btn", onclick: esci }, "Annulla"), pub));
    pub.addEventListener("click", async () => {
      pub.disabled = true; pub.textContent = "Pubblico…";
      try {
        await artifact.publish(documento(state));
        msg.textContent = "Pubblicato: la pagina si ricarica.";
      } catch (x) {
        const code = x && x.code;
        msg.textContent = code === "conflict" ? "Qualcun altro ha pubblicato prima di te: la pagina si ricarica con la sua versione, rifai le modifiche."
          : (code === "not_writer" || code === "not_granted") ? "Da qui non puoi modificare la pagina: aprila dal tuo account Claude."
          : code === "rate_limited" ? "Troppe pubblicazioni di seguito: riprova tra un minuto."
          : `Pubblicazione non riuscita (${code || "errore"}).`;
        pub.disabled = false; pub.textContent = "Pubblica le modifiche";
      }
    });
    document.body.append(bar);
    render();
  }
  function esci() {
    editing = false; state = saved;
    document.body.classList.remove("editing");
    if (bar) bar.remove();
    fab.hidden = false;
    render();
  }

  // la pagina completa, nello stesso formato con cui è stata pubblicata
  const RESET = ":root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}";
  const S = "scr" + "ipt";
  const HEAD = '<title>iac_tech_rev</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n'
    + '<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n'
    + '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,300..900;1,62..125,300..900&family=JetBrains+Mono:wght@400;600&display=swap">\n';
  function documento(s) {
    return "<!doctype html><html><head><meta charset=utf8><meta name=viewport content=\"width=device-width,initial-scale=1,viewport-fit=cover\"><style>" + RESET + "</style></head><body>"
      + HEAD
      + "<style id=\"css\">" + $("#css").textContent + "</style>\n"
      + "<template id=\"shell\">" + shell.innerHTML + "</template>\n"
      + `<${S} type="application/json" id="state">` + JSON.stringify(s).replace(/</g, "\\u003c") + `</${S}>\n`
      + `<${S} id="app">` + $("#app").textContent + `</${S}>`
      + "</body></html>";
  }

  const fab = el("button", { type: "button", class: "edit-fab", hidden: true, onclick: entra }, "✎ Modifica pagina");
  document.body.append(fab);
  (async () => {
    if (!(window.claude && window.claude.use)) return;
    const [user, a, art] = await Promise.all(["user", "assets", "artifact"].map(n => window.claude.use(n)));
    if (!user || !a || !art) return;
    if (!(await user.canEdit())) return;
    assets = a; artifact = art;
    fab.hidden = false;
  })().catch(() => {});
})();
</script>
